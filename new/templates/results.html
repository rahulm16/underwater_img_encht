<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Add cache control meta tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Enhancement Results</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0066cc;
            --secondary-color: #00ccff;
            --background-color: #001e3c;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            margin-top: 2rem;
            padding-bottom: 150px; /* Increased padding to prevent overlap */
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border-radius: 0 0 2rem 2rem;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            text-align: center;
        }

        .upload-area {
            border: 2px dashed var(--secondary-color);
            border-radius: 1rem;
            padding: 2rem;
            margin: 1rem 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        .upload-area i {
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        #fileInput {
            display: none;
        }

        .button {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.3s ease;
            margin: 1rem 0;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            padding: 1rem;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 1.5rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .image-container:hover {
            transform: translateY(-5px);
        }

        .image-container h3 {
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
            color: var(--secondary-color);
        }

        .image-container img {
            max-width: 100%;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .image-container img:hover {
            transform: scale(1.02);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-color));
        }

        .download-btn i {
            font-size: 1.2rem;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }

        .loading i {
            font-size: 2rem;
            color: var(--secondary-color);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-button {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-button:hover {
            background: var(--secondary-color);
            transform: translateX(-5px);
        }

        .new-upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-color));
            color: white;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 1.2rem;
            text-decoration: none;
            margin: 2rem auto;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .new-upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
        }

        footer {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem;
            text-align: center;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: fixed;
            bottom: 0;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                padding-bottom: 180px; /* Extra padding for mobile */
            }
            
            .results {
                gap: 1.5rem;
            }

            .image-container {
                padding: 1rem;
            }

            .back-button {
                display: none;
            }

            footer {
                padding: 0.8rem;
            }

            footer p {
                font-size: 0.9rem;
                margin: 0.3rem 0;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-button">
        <i class="fas fa-arrow-left"></i> Back
    </a>
    
    <header>
        <h1><i class="fas fa-water"></i> Enhancement Results</h1>
        <p>Here are your enhanced images</p>
    </header>

    <div class="container">
        <div class="results">
            <div class="image-container">
                <h3>Original Image</h3>
                <img src="{{ original_image }}" alt="Original Image">
                <a href="{{ original_image }}" download class="download-btn">
                    <i class="fas fa-download"></i> Download Original
                </a>
            </div>
            <div class="image-container">
                <h3>Enhanced Image</h3>
                <img src="{{ enhanced_image }}" alt="Enhanced Image">
                <a href="{{ enhanced_image }}" download class="download-btn">
                    <i class="fas fa-download"></i> Download Enhanced
                </a>
            </div>
        </div>
        <div style="text-align: center;">
            <a href="/upload" class="new-upload-btn">
                <i class="fas fa-cloud-upload-alt"></i> Upload New Image
            </a>
        </div>
    </div>

    <footer style="background: rgba(0, 0, 0, 0.5); padding: 1rem; text-align: center; width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); position: fixed; bottom: 0; z-index: 1000;">
        <p style="font-size: 1.1rem; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.9);">Created by Bhavana G and Bhavana Kabbur</p>
        <p style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.7);">Underwater Image Processing Project &copy; 2024</p>
    </footer>
</body>
</html>
